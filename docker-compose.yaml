services:
  # MongoDB Standalone (sem replica set)
  mongodb:
    container_name: cinbora-mongodb
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - cinbora_mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: mongosh admin -u ${MONGO_USERNAME} -p ${MONGO_PASSWORD} --eval "db.adminCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Aplicação combinada frontend/backend
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cinbora-app:${APP_VERSION}
    container_name: cinbora-app
    ports:
      - "3005:3000"  # Frontend 
      - "3015:3333"  # Backend 
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      NEXT_PUBLIC_API_URL: http://localhost:3015  # URL para o frontend acessar o backend
    env_file:
      - ${ENV_FILE:-.env}  
    networks:
      - app-network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3005 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    name: cinbora-network
    driver: bridge

volumes:
  cinbora_mongodb_data:
    name: cinbora_mongodb_data