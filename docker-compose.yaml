services:
  # MongoDB Standalone (sem replica set)
  mongodb:
    container_name: cinbora-mongodb
    image: mongo:7.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - cinbora_mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: mongosh admin -u ${MONGO_USERNAME} -p ${MONGO_PASSWORD} --eval "db.adminCommand('ping').ok" || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Aplicação combinada frontend/backend
  frontend:
    container_name: cinbora-frontend
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
      - PORT=3005
    ports:
    - "3005:3005"
    networks:
      - app-network
      
  backend:
    container_name: cinbora-backend
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - BACKEND_PORT=3015
      - FRONTEND_URL=http://localhost:3005

      - MONGO_HOST=mongodb
      - MONGO_PORT=${MONGO_PORT:-27017}
      - MONGO_USERNAME=${MONGO_USERNAME}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - API_LINK=${API_LINK}
      - SECRET_KEY=${SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - NODE_ENV=${NODE_ENV:-development}
    ports:
    - "3015:3015"
    depends_on:
      - mongodb
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: cinbora-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    name: cinbora-network
    driver: bridge

volumes:
  cinbora_mongodb_data:
    name: cinbora_mongodb_data